[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-growth-plotter"
version = "0.1.1"
authors = [
    { name = "Ishan Dutta", email="ishandutta2007@gmail.com" },
]
description = "A tool to fetch GitHub stargazers and plot growth over time."
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "matplotlib",
]

[project.scripts]
github-growth-plot = "github_growth_plotter.cli:main"


[project.urls]
Homepage = "https://github.com/ishandutta2007/add-github-growth-plot"
Repository = "https://github.com/ishandutta2007/add-github-growth-plot"
Documentation = "https://github.com/ishandutta2007/add-github-growth-plot#readme"
Issues = "https://github.com/ishandutta2007/add-github-growth-plot/issues"
